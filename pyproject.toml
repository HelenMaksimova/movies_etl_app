[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"
exclude = [
    ".venv",
    "migrations",
    ".env",
]

[tool.ruff.lint]
extend-select = [
    "I",      # isort: сортировка импортов
    "RUF022", # сортировка элементов в __all__
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F403"]

[tool.ruff.lint.isort]
combine-as-imports = true

section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

no-lines-before = [
    "standard-library",
    "local-folder",
]

known-first-party = ["src"]
